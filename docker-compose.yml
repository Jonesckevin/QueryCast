---
services:

  # ── Frontend: nginx serving the static SPA ──
  querycast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querycast
    ports:
      - "${EXTERNAL_PORT:-9013}:8080"
    depends_on:
      querycast-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - querycast-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Backend: Flask API (JWT auth, rate limiting, WebSocket, file upload) ──
  querycast-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querycast-api
    expose:
      - "5000"
    volumes:
      # Persistent volume for uploaded files and application data
      - querycast-data:/data
    restart: unless-stopped
    networks:
      - querycast-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Persistent volume (database-style storage with controlled permissions) ──
volumes:
  querycast-data:
    driver: local

networks:
  querycast-network:
    driver: bridge
