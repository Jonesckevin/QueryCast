server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Hide nginx version ──
    server_tokens off;

    # ── Security Headers ──
    # NOTE: child location blocks that add their own add_header directives will
    # NOT inherit these. To avoid that, only `expires` is used in child blocks.
    #
    # CSP notes:
    #  - script-src includes cdnjs (highlight.js) and unpkg (js-yaml)
    #  - unsafe-inline is required by two onclick= attributes in index.html
    #  - connect-src https: permits browser-to-AI-provider direct API calls
    #    (OpenAI, Anthropic, Groq, etc.) configured in the AI assistant
    #  - localhost/127.0.0.1 wildcard permits Ollama & LM Studio local models
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none';" always;
    add_header X-Frame-Options        "DENY"                                   always;
    add_header X-Content-Type-Options "nosniff"                                always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # ── API proxy → Flask backend ──
    location /api/ {
        proxy_pass            http://querycast-api:5000;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
    }

    # ── Socket.io WebSocket proxy ──
    location /socket.io/ {
        proxy_pass         http://querycast-api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Static asset caching ──
    # Uses `expires` (not add_header) so security headers above are inherited.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 30d;
    }

    # ── HTML: no caching ──
    # Uses `expires -1` (sets Cache-Control: no-cache automatically via expires).
    location ~* \.html?$ {
        expires -1;
    }

    # ── SPA routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
